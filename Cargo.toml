[package]
name = "cube-rs"
version = "0.1.0"
edition = "2024"

[lib]
name = "cube_rs"
# cdylib for the APK, lib for host tests.
crate-type = ["cdylib", "lib"]

[dependencies]
# Same version as android-activity, which sets JavaVM::singleton().
jni = "0.22"
log = "0.4"
# Settings as JSON. No dependencies and no syn, unlike serde.
nanoserde = { version = "0.2.1", default-features = false, features = ["json"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "android-native-activity"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
libc = "0.2"
ndk = { version = "0.9", default-features = false, features = ["audio"] }
ndk-sys = "0.6"
winit = { version = "0.30", default-features = false }

# Starts a JVM on the host.
[target.'cfg(not(target_os = "android"))'.dependencies]
jni = { version = "0.22", features = ["invocation"] }

[profile.release]
lto = true
strip = true
